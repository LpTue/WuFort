baseURL: https://lptue.github.io/WuFort/
locale: en-us
title: WuFort
theme: ["PaperMod"]

# Cần cho tính năng Search
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  ShowToc: true
  TocOpen: true
  ShowReadingTime: true
  ShowAllPagesInArchive: true

  # Các section hiển thị ở trang chủ / archive (tên thư mục trong content/)
  mainSections:
    - knowledge
    - tools
    - picoctf_easy
    - picoctf_medium
    - minictf
    - bksec

  profileMode:
    enabled: true
    title: "WuFort"
    subtitle: "Dự án lưu lại kiến thức về forensics"
    imageUrl: "https://avatars.githubusercontent.com/u/89103573?v=4&size=64"
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: Knowledge
        url: "https://lptue.github.io/WuFort/knowledge/"
      - name: Tools
        url: "https://lptue.github.io/WuFort/tools/"
      - name: WriteUp
        url: "https://lptue.github.io/WuFort/writeup/"
  socialIcons:
    - name: facebook
      url: "https://www.facebook.com/profile.php?id=61593526254843"
    - name: github
      url: "https://github.com/LpTue"

menu:
  main:
    - identifier: tags
      name: Tags
      pageRef: /tags
      weight: 10
    - identifier: search
      name: Search
      pageRef: /search
      weight: 20